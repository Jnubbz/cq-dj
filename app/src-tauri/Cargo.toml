[package]
name = "cq-dj-app"
description = "CQ DJ desktop app"
version.workspace = true
edition.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cqdj-engine = { path = "../../crates/cqdj-engine" }
cqdj-radio = { path = "../../crates/cqdj-radio" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
