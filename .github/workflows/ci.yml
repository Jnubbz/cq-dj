name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio/serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Test engine and radio layer (includes the 45 s real-time station test)
        run: cargo test --release -- --include-ignored

  app-macos:
    name: Build Mac app
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build CQ DJ.app and .dmg (Apple Silicon)
        working-directory: app
        run: |
          npm ci
          # Test builds aren't signed for the updater; releases are (release.yml).
          npx tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check microphone permission is in the app
        run: |
          APP="target/release/bundle/macos/CQ DJ.app"
          codesign -d --entitlements - "$APP" 2>&1 | tee /tmp/ent.txt
          grep -q "com.apple.security.device.audio-input" /tmp/ent.txt || { echo "::error::app is missing the audio-input entitlement"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist" || { echo "::error::Info.plist is missing NSMicrophoneUsageDescription"; exit 1; }
      - name: Zip the app
        run: |
          cd target/release/bundle/macos
          ditto -c -k --keepParent "CQ DJ.app" "$GITHUB_WORKSPACE/CQ-DJ-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CQ-DJ-mac
          path: |
            target/release/bundle/dmg/*.dmg
            CQ-DJ-mac.zip
          if-no-files-found: error
